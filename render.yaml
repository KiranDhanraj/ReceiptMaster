services:
  - type: web
    name: receiptwebapp-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: receiptwebapp-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173

databases:
  - name: receiptwebapp-db
    plan: free
    databaseName: receipt_app
    user: receipt_user
